[package]
name = "lockpass-next-desktop"
version = "0.1.4"
description = "LockPass desktop application"
authors = ["LockPass"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lockpass_next_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
base64 = "0.22"
keyring = { version = "3.6.3", features = ["windows-native"] }
refinery = { version = "0.9.1", features = ["rusqlite"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
tauri = { version = "2", features = ["config-json5"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-process = "2.3.0"
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
