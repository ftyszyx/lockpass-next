name: lockpass

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lockpass
      POSTGRES_USER: lockpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockpass -d lockpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  server:
    build:
      context: ./server
    environment:
      LOCKPASS_SERVER_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://lockpass:${POSTGRES_PASSWORD}@postgres:5432/lockpass
      LOCKPASS_CORS_ORIGIN: https://${LOCKPASS_DOMAIN},https://${LOCKPASS_ADMIN_DOMAIN},http://tauri.localhost
      LOCKPASS_BOOTSTRAP_ADMIN_USERNAME: ${LOCKPASS_ADMIN_USERNAME:?Set LOCKPASS_ADMIN_USERNAME in the deployment env file}
      LOCKPASS_BOOTSTRAP_ADMIN_PASSWORD: ${LOCKPASS_ADMIN_PASSWORD:?Set LOCKPASS_ADMIN_PASSWORD in the deployment env file}
      RUST_LOG: ${LOCKPASS_RUST_LOG:-lockpass_sync_server=info,tower_http=info}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - backend
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_LOCKPASS_OFFICIAL_SERVER_URL: https://${LOCKPASS_DOMAIN:?Set LOCKPASS_DOMAIN in the deployment env file}
        VITE_LOCKPASS_OFFICIAL_API_URL: https://${LOCKPASS_DOMAIN:?Set LOCKPASS_DOMAIN in the deployment env file}
        VITE_LOCKPASS_API_BASE_URL: https://${LOCKPASS_DOMAIN:?Set LOCKPASS_DOMAIN in the deployment env file}
    environment:
      LOCKPASS_DOMAIN: ${LOCKPASS_DOMAIN:?Set LOCKPASS_DOMAIN in the deployment env file}
      LOCKPASS_ADMIN_DOMAIN: ${LOCKPASS_ADMIN_DOMAIN:?Set LOCKPASS_ADMIN_DOMAIN in the deployment env file}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
