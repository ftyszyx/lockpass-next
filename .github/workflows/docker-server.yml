## Build Docker images
## 需要配置  secrets
## DOCKERHUB_USERNAME
## DOCKERHUB_TOKEN
##  variables
## LOCKPASS_PUBLIC_URL: 用户web和api的公网访问地址，必须是https开头https://vault.lockpass.cn
## LOCKPASS_ADMIN_URL: 管理员web，必须是https开头https://admin.lockpass.cn

name: Build Docker images

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      public_url:
        description: Public user Web and API URL used by the gateway image
        required: false
        type: string
      admin_url:
        description: Public administrator Web URL used by the gateway image
        required: false
        type: string

env:
  SERVER_IMAGE_NAME: ftyszyx752/lockpass
  GATEWAY_IMAGE_NAME: ftyszyx752/lockpass-gateway
  SERVER_VERSION: ${{ github.ref_name }}

jobs:
  build-and-push:
    name: Build and push server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.SERVER_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set build time
        id: build_time
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.SERVER_VERSION }}
            APP_IMAGE_NAME=${{ env.SERVER_IMAGE_NAME }}
            APP_IMAGE_TAG=${{ github.ref_name }}
            APP_GIT_COMMIT=${{ github.sha }}
            APP_BUILD_TIME=${{ steps.build_time.outputs.value }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-and-push-gateway:
    name: Build and push gateway image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLIC_URL: ${{ inputs.public_url || vars.LOCKPASS_PUBLIC_URL }}
      ADMIN_URL: ${{ inputs.admin_url || vars.LOCKPASS_ADMIN_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate gateway configuration
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "Set the LOCKPASS_PUBLIC_URL repository variable or provide public_url when running the workflow manually."
            exit 1
          fi
          if [ -z "$ADMIN_URL" ]; then
            echo "Set the LOCKPASS_ADMIN_URL repository variable or provide admin_url when running the workflow manually."
            exit 1
          fi
          case "$PUBLIC_URL" in
            https://*) ;;
            *) echo "LOCKPASS_PUBLIC_URL must start with https://"; exit 1 ;;
          esac
          case "$ADMIN_URL" in
            https://*) ;;
            *) echo "LOCKPASS_ADMIN_URL must start with https://"; exit 1 ;;
          esac
          if [ "$PUBLIC_URL" = "$ADMIN_URL" ]; then
            echo "LOCKPASS_PUBLIC_URL and LOCKPASS_ADMIN_URL must be different."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GATEWAY_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=manual,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_LOCKPASS_OFFICIAL_SERVER_URL=${{ env.PUBLIC_URL }}
            VITE_LOCKPASS_OFFICIAL_API_URL=${{ env.PUBLIC_URL }}
            VITE_LOCKPASS_API_BASE_URL=${{ env.PUBLIC_URL }}
            LOCKPASS_DEPLOY_MODE=production
            LOCKPASS_PUBLIC_URL=${{ env.PUBLIC_URL }}
            LOCKPASS_ADMIN_URL=${{ env.ADMIN_URL }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
