# This workflow uploads the Windows installer only to GitHub Release.
# No OSS configuration is required.
#
# Required GitHub repository secrets:
# - TAURI_SIGNING_PRIVATE_KEY
# - TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# Required GitHub repository variables:
# - TAURI_SIGNING_PUBLIC_KEY

name: Release Windows desktop

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Validate release configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Set the TAURI_SIGNING_PRIVATE_KEY repository secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PUBLIC_KEY)) {
            throw "Set the TAURI_SIGNING_PUBLIC_KEY repository variable."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Test release tooling
        run: python -m unittest tools/test_pc_release.py

      - name: Build Windows release
        run: python tools/pc_release.py --channel web --platform windows-x86_64

      - name: Create GitHub Release and upload desktop artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes; then
              sleep 3
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
            fi
          fi

          files=(tools/dist/pc_release/*-setup.exe)
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Desktop release artifact is missing: $file"
              exit 1
            fi
          done
          gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
